<meta charset="UTF-8" />

<title>The-K 더 캐보자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --blue-primary: #21409a;
    --blue-accent: #2853f6;
    --blue-light: #e1ebff;
    --chip-border: #ebebeb;
    --chip-gray: #909fcc;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #fff;
    color: var(--blue-primary);
  }

  .page {
    max-width: 1920px;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    width: 100%;
  }

  .gnb {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 50px min(160px, 8.3333vw);
  }

  .logo {
    font-family: "Paperlogy", "Pretendard", sans-serif;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -1.2px;
    color: var(--blue-primary);
    white-space: nowrap;
    cursor: default;
  }

  /* ---------- Episode chip nav ---------- */
  nav.ep-menu {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 16px;
    /* inactive chip's 2px border pushes its auto height to 60px (8+8
       padding + 40 icon + 2+2 border) — 68px - 12px bottom padding only
       left 56px of room, clipping ~4px off the chip's top/bottom */
    height: 72px;
    padding: 0 min(160px, 8.3333vw) 12px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  nav.ep-menu::-webkit-scrollbar { display: none; }

  .chip-wrap { flex-shrink: 0; }

  .chip-btn {
    appearance: none;
    border: none;
    background: transparent;
    font-family: inherit;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: block;
  }

  .chip-btn:focus-visible {
    outline: 2px solid var(--blue-accent);
    outline-offset: 2px;
    border-radius: 16px;
  }

  .chip-icon {
    display: block;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    background: transparent;
  }
  .chip-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* inactive: bordered white pill, icon + gray label */
  .chip-inactive {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px 8px 8px;
    border: 2px solid var(--chip-border);
    border-radius: 16px;
    background: #fff;
  }

  .chip-label-inactive {
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.72px;
    color: var(--chip-gray);
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .chip-btn:hover .chip-inactive { border-color: var(--blue-accent); }
  .chip-btn:hover .chip-label-inactive { color: var(--blue-accent); }

  /* active: expanded light-blue box, icon + EP label + inline hashtags,
     with a scroll-scrubbed blue fill sweeping left -> right underneath */
  .chip-active-box {
    display: none;
    position: relative;
    overflow: hidden;
    align-items: center;
    gap: 32px;
    padding: 8px 32px 8px 8px;
    border-radius: 16px;
    background: var(--blue-light);
  }

  .chip-wrap.active .chip-inactive { display: none; }
  .chip-wrap.active .chip-active-box { display: flex; }

  .chip-active-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .chip-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chip-ep-label {
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.72px;
    color: var(--blue-accent);
    white-space: nowrap;
    text-transform: uppercase;
  }

  .chip-tags {
    display: flex;
    gap: 21px;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: -0.48px;
    color: var(--blue-accent);
    white-space: nowrap;
    text-transform: uppercase;
  }

  .chip-tags a {
    font-family: inherit;
    color: inherit;
    text-decoration: none;
  }
  .chip-tags a:hover { text-decoration: underline; }

  .chip-fill {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 8px 32px 8px 8px;
    background: var(--blue-accent);
    clip-path: inset(0 100% 0 0);
    will-change: clip-path;
    pointer-events: none;
  }

  .chip-fill .chip-ep-label,
  .chip-fill .chip-tags { color: #fff; }

  /* ---------- Content ---------- */
  main {
    width: 100%;
    line-height: 0;
  }

  .content-image {
    display: block;
    width: 100%;
    height: auto;
  }

  .content-blank {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 800px;
    background: #fff;
    font-size: 40pt;
    font-weight: 700;
    color: var(--blue-primary);
    line-height: normal;
  }

  /* 복지혜택 mobile-only responsive frame: fixed-width foreground centered
     over a background that fills the rest of the viewport and disappears
     once the viewport narrows to the foreground's own width (375px) */
  .benefit-frame {
    display: none;
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .benefit-frame.active { display: block; }

  .benefit-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 0;
  }

  .benefit-fg {
    position: relative;
    z-index: 1;
    display: block;
    width: 375px;
    height: auto;
    margin: 0 auto;
  }

  @media (max-width: 768px) {
    header { box-shadow: 0px 4px 5px rgba(0, 0, 0, 0.15); }

    .gnb { padding: 40px 20px 24px 24px; }
    .logo { font-size: 25px; letter-spacing: -0.76px; }

    nav.ep-menu {
      gap: 8px;
      height: 48px;
      padding: 0 20px 8px 24px;
    }

    .chip-icon { width: 24px; height: 24px; }
    .chip-inactive { gap: 8px; padding: 6px 16px 6px 6px; border-radius: 12px; border-width: 1px; }
    .chip-label-inactive { font-size: 13px; letter-spacing: -0.39px; }

    .chip-active-box { gap: 12px; padding: 6px 16px 6px 6px; border-radius: 12px; }
    .chip-fill { gap: 12px; padding: 6px 16px 6px 6px; border-radius: 12px; }
    .chip-title { gap: 8px; }
    .chip-ep-label { font-size: 13px; letter-spacing: -0.39px; }
    .chip-tags { gap: 12px; font-size: 13px; letter-spacing: -0.39px; }
  }
</style>

  <script>
    const chipWraps = document.querySelectorAll('.chip-wrap');
    const contentImage = document.getElementById('contentImage');
    const benefitFrame = document.getElementById('benefitFrame');
    // content images (firstpay/retire/deposit) keep swapping at 768px
    const contentMobileQuery = window.matchMedia('(max-width: 768px)');

    // each tab's content image is a different height, which changes how
    // tall the page actually is — recompute the scroll range once the
    // newly-swapped image has actually loaded and laid out at its real size.
    contentImage.addEventListener('load', () => {
      if (window.ScrollTrigger) ScrollTrigger.refresh();
    });
    const navMenu = document.getElementById('navMenu');

    // the 4 tabs with no real content yet each get their own light,
    // distinct placeholder background instead of a plain blank white block.
    const BLANK_COLORS = {
      future: '#f1e9ff',
      lowtax: '#e4f6ea',
      deduction: '#fff6dd',
      yearend: '#ffe7ee',
    };

    function applyContent(wrap) {
      // 복지혜택 always gets the fixed-375px-foreground + shrinking-background
      // treatment instead of the plain swapped <img>, at every width
      const useBenefitFrame = wrap.dataset.key === 'benefit';
      benefitFrame.classList.toggle('active', useBenefitFrame);

      if (useBenefitFrame) {
        contentImage.style.display = 'none';
        const existingBlank = document.getElementById('contentBlank');
        if (existingBlank) existingBlank.style.display = 'none';
        return;
      }

      const src = (contentMobileQuery.matches && wrap.dataset.contentMobile)
        ? wrap.dataset.contentMobile
        : wrap.dataset.content;

      if (src) {
        contentImage.src = src;
        contentImage.style.display = '';
      } else {
        contentImage.style.display = 'none';
        let blank = document.getElementById('contentBlank');
        if (!blank) {
          blank = document.createElement('div');
          blank.id = 'contentBlank';
          blank.className = 'content-blank';
          blank.textContent = '콘텐츠 영역';
          contentImage.insertAdjacentElement('afterend', blank);
        }
        blank.style.background = BLANK_COLORS[wrap.dataset.key] || '#f2f2f2';
        blank.style.display = 'flex';
      }

      const existingBlank = document.getElementById('contentBlank');
      if (src && existingBlank) existingBlank.style.display = 'none';
    }

    // whichever chip becomes active always lands at the nav's own left
    // inset — 160 on desktop, 24 on mobile (matches nav.ep-menu's own
    // left padding at each breakpoint) — so it's always in the same spot,
    // not just scrolled into view.
    function activeChipX() {
      return contentMobileQuery.matches ? 28 : 160;
    }

    function scrollActiveIntoView(wrap, smooth) {
      const navRect = navMenu.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const delta = wrapRect.left - navRect.left;
      const target = Math.max(0, navMenu.scrollLeft + delta - activeChipX());
      navMenu.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
    }

    function setActive(wrap, opts) {
      chipWraps.forEach((w) => w.classList.remove('active'));
      wrap.classList.add('active');
      applyContent(wrap);
      scrollActiveIntoView(wrap, !(opts && opts.instant));

      // switching tabs swaps in a whole new (differently-tall) content
      // image, so the old vertical scroll position no longer means
      // anything for it — jump back to the top and recompute the scroll
      // range immediately, so the fill/scroll animation ScrollTrigger
      // isn't left using the previous tab's page height as "max".
      window.scrollTo(0, 0);
      if (window.ScrollTrigger) ScrollTrigger.refresh();
    }

    chipWraps.forEach((wrap) => {
      wrap.querySelector('.chip-btn').addEventListener('click', () => setActive(wrap));
    });

    const initialActive = document.querySelector('.chip-wrap.active');
    if (initialActive) {
      applyContent(initialActive);
      scrollActiveIntoView(initialActive, false);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => scrollActiveIntoView(initialActive, false));
      }
      window.addEventListener('load', () => scrollActiveIntoView(initialActive, false));
    }

    contentMobileQuery.addEventListener('change', () => {
      const activeWrap = document.querySelector('.chip-wrap.active');
      if (activeWrap) applyContent(activeWrap);
    });

    let resizeFrame = null;
    window.addEventListener('resize', () => {
      if (resizeFrame) return;
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = null;
        const activeWrap = document.querySelector('.chip-wrap.active');
        if (activeWrap) scrollActiveIntoView(activeWrap, false);
      });
    });

    // GSAP ScrollTrigger: whichever episode chip is active, its box fills
    // left -> right mapped to the entire page scroll range.
    gsap.registerPlugin(ScrollTrigger);

    // Single ScrollTrigger drives both the chip's color fill and (on mobile)
    // the nav's horizontal scroll off the exact same `self.progress` value
    // each frame, so the two stay perfectly locked to one another instead
    // of drifting as two independently-refreshed triggers.
    const ACTIVE_CHIP_START_X = 28;
    const ACTIVE_CHIP_TAIL = 32;
    const chipFills = document.querySelectorAll('.chip-fill');

    ScrollTrigger.create({
      trigger: document.body,
      start: 'top top',
      end: 'max',
      scrub: true,
      onUpdate: (self) => {
        const p = self.progress;

        chipFills.forEach((el) => {
          el.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`;
        });

        if (!contentMobileQuery.matches) return;
        const fullMax = navMenu.scrollWidth - navMenu.clientWidth;
        if (fullMax <= 0) return;

        const activeWrap = document.querySelector('.chip-wrap.active');
        if (!activeWrap) return;

        // content-space position of the active chip's edges — stable
        // regardless of the current scrollLeft, since it adds that same
        // scrollLeft back on to the viewport-relative measurement.
        const navRect = navMenu.getBoundingClientRect();
        const wrapRect = activeWrap.getBoundingClientRect();
        const contentLeft = navMenu.scrollLeft + (wrapRect.left - navRect.left);
        const contentRight = contentLeft + wrapRect.width;

        const base = Math.max(0, contentLeft - ACTIVE_CHIP_START_X);
        const cap = Math.min(fullMax, Math.max(base, contentRight - ACTIVE_CHIP_TAIL));

        navMenu.scrollLeft = base + (cap - base) * p;
      },
    });
  </script>
</body>
</html>
